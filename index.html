<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icones/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Azul-marinho da marca: pinta a barra do navegador no Android. -->
    <meta name="theme-color" content="#2b3a5e" />
    <meta
      name="description"
      content="RePerfil — controle de sobras de perfis de alumínio e orçamento de esquadrias."
    />
    <title>RePerfil</title>
    <!--
      Aplica o tema escolhido antes de qualquer coisa aparecer na tela. Se
      isto esperasse o JavaScript da aplicação carregar, quem escolheu claro
      com o celular no escuro (ou o contrário) veria a tela piscar na cor
      errada a cada abertura.
    -->
    <script>
      try {
        var tema = localStorage.getItem('reperfil:tema')
        if (tema === 'claro' || tema === 'escuro') {
          document.documentElement.setAttribute('data-tema', tema)
        }
      } catch (e) {
        // Armazenamento bloqueado: segue o tema do sistema, sem quebrar.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
