apply plugin: 'com.android.application'

/*
 * A versão vem do package.json, para não existirem dois lugares dizendo em
 * que versão o aplicativo está. Manter os dois à mão dá exatamente errado
 * no pior momento: a Play Store recusa o envio dizendo que o versionCode já
 * existe, e descobrir que alguém esqueceu de incrementar aqui custa uma hora.
 *
 * `versionName` é o que o usuário vê: "0.8.0".
 * `versionCode` é um inteiro que a Play Store exige SEMPRE crescente. Ele é
 * derivado da versão: 0.8.0 vira 800, 1.2.3 vira 10203. Assim ele acompanha
 * sozinho, e sobra espaço para 99 versões menores e 99 correções.
 */
def pacote = new groovy.json.JsonSlurper().parseText(
    file('../../package.json').text
)
def partes = pacote.version.tokenize('.').collect { it.toInteger() }
def versaoNome = pacote.version
def versaoCodigo = partes[0] * 10000 + partes[1] * 100 + partes[2]

/*
 * A chave de assinatura da loja, quando existir.
 *
 * ── POR QUE FORA DO PROJETO, NUM ARQUIVO À PARTE ─────────────────────────
 *
 * A Google identifica o aplicativo pela chave. Perdê-la significa nunca
 * mais publicar uma atualização DESTE aplicativo — seria preciso criar
 * outro, com outro identificador, e pedir a todo mundo que reinstale.
 * Vazá-la é pior: qualquer um assina um pacote que o celular aceita como
 * se fosse o RePerfil.
 *
 * Por isso nem o arquivo `.jks` nem as senhas moram aqui. Eles ficam em
 * `android/keystore.properties`, que o `.gitignore` bloqueia, e o próprio
 * `.jks` de preferência fora da pasta do projeto.
 *
 * ── POR QUE TUDO É CONDICIONAL ───────────────────────────────────────────
 *
 * Sem o `keystore.properties`, o bloco `signingConfigs` simplesmente não é
 * criado, e o `release` sai sem assinatura. Isso é de propósito: quem
 * clonar o repositório sem a chave — outra máquina sua, um dia outro
 * programador — continua compilando e rodando o aplicativo em depuração
 * normalmente, em vez de esbarrar num erro sobre um arquivo que nunca vai
 * ter.
 *
 * O preço é que `bundleRelease` sem a chave gera um pacote não assinado,
 * que a Play Store recusa. O aviso no fim deste arquivo existe para isso
 * não ser descoberto só depois do envio.
 */
def arquivoChave = rootProject.file('keystore.properties')
def propsChave = new Properties()
def temChave = arquivoChave.exists()

if (temChave) {
    arquivoChave.withInputStream { propsChave.load(it) }
}

android {
    namespace = "br.com.reperfil.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.reperfil.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versaoCodigo
        versionName versaoNome
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (temChave) {
        signingConfigs {
            release {
                storeFile file(propsChave['storeFile'])
                storePassword propsChave['storePassword']
                keyAlias propsChave['keyAlias']
                keyPassword propsChave['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (temChave) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/*
 * Avisa ANTES de gerar um pacote que a loja vai recusar.
 *
 * Sem isto, `bundleRelease` sem a chave termina com "BUILD SUCCESSFUL" e
 * produz um `.aab` de aparência normal — o problema só aparece minutos
 * depois, no envio à Play Store, com uma mensagem que não explica onde
 * mexer. O aviso aqui custa uma linha e economiza essa viagem.
 */
gradle.taskGraph.whenReady { grafo ->
    def vaiEmpacotarRelease = grafo.allTasks.any {
        it.name.contains('Release') && (it.name.startsWith('bundle') || it.name.startsWith('assemble'))
    }

    if (vaiEmpacotarRelease && !temChave) {
        logger.warn('')
        logger.warn('┌─────────────────────────────────────────────────────────────┐')
        logger.warn('│  ATENÇÃO: build de release SEM assinatura.                  │')
        logger.warn('│                                                             │')
        logger.warn('│  Falta o arquivo android/keystore.properties. O pacote vai  │')
        logger.warn('│  ser gerado, mas a Play Store vai RECUSAR.                  │')
        logger.warn('│                                                             │')
        logger.warn('│  Como criar: docs/publicacao-play-store.md, Passos 2 e 3.   │')
        logger.warn('└─────────────────────────────────────────────────────────────┘')
        logger.warn('')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
